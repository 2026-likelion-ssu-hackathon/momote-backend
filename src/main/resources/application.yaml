spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wellness_mate}
    username: ${SPRING_DATASOURCE_USERNAME:wellness_mate}
    password: ${SPRING_DATASOURCE_PASSWORD:wellness_mate_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://momote-frontend.vercel.app,https://www.momote.site,https://momote.site}
  ai-worker:
    base-url: ${AI_WORKER_BASE_URL:http://localhost:8000}
    timeout: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
